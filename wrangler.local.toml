# Local emulation only. Never use this configuration for a cloud deployment.
name = "aistock-extapi"
main = "src/index.ts"
compatibility_date = "2026-01-08"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node scripts/generate-migrations.mjs"

[[kv_namespaces]]
binding = "KV"

[[d1_databases]]
binding = "DB"
database_name = "aistock"
migrations_dir = "migrations"
migrations_table = "stockwatch_schema_migrations"

[assets]
directory = "./.tmp/web-dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
