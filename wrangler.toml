name = 'aistock-extapi'
main = "src/index.ts"
compatibility_date = "2026-01-08"
compatibility_flags = ["nodejs_compat"]

# Runtime variables and resources are managed in the Cloudflare dashboard.
keep_vars = true

[build]
command = "node scripts/generate-migrations.mjs"

# Wrangler's upload metadata preserves existing resources by binding type.
# Include variables and secrets because this overrides the generated keep_bindings.
[unsafe.metadata]
keep_bindings = ["kv_namespace", "d1", "ai", "plain_text", "json", "secret_text", "secret_key"]

[triggers]
crons = [
  "*/30 * * * *",
  "* * * * *",
  "30 1 * * 1-5", # UTC -> 北京时间 09:30
  "0 5 * * 1-5",  # UTC -> 北京时间 13:00
  "0 7 * * 1-5"   # UTC -> 北京时间 15:00
]

[assets]
directory = "./.tmp/web-dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
