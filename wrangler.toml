name = 'aistock-extapi'
main = "src/index.ts"
compatibility_date = "2026-01-08"
compatibility_flags = ["nodejs_compat"]

[vars]
# 前端来源（用于 CORS 和请求来源校验）
FRONTEND_URL = "https://aistocklink.cn"
CORS_ALLOW_ORIGIN = "https://aistocklink.cn"

# 大模型评价接口地址
OPENAI_API_BASE_URL = "https://gen.pollinations.ai/v1/chat/completions"
EVA_MODEL = "openai-large"
OCR_MODEL = "openai"

# 定时任务相关设置
MONITOR_ENABLED = "false"
CRON_HOT_TOPN = "8"
CRON_ANALYSIS_CONCURRENCY = "2"

# 敏感信息请通过 wrangler secret put 设置:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put AUTH_PASSWORD_PEPPER (at least 32 characters)
#   wrangler secret put MONITOR_ADMIN_TOKEN (at least 32 characters)
#   wrangler secret put MONITOR_WEBHOOK_URL
#   wrangler secret put MONITOR_WEBHOOK_TOKEN (optional)

# KV Namespace binding
[[kv_namespaces]]
binding = "KV" 
id = "2e22a1ea7d91471e8476969f8e89ccab"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "aistock"
database_id = "f6efa1f1-4414-491c-a5d6-809fb1adfb8d" # 运行 wrangler d1 create aistock 后填入

[triggers]
crons = [
  "*/30 * * * *",
  "* * * * *",
  "30 1 * * 1-5", # UTC -> 北京时间 09:30
  "0 5 * * 1-5",  # UTC -> 北京时间 13:00
  "0 7 * * 1-5"   # UTC -> 北京时间 15:00
]

[[routes]]
pattern = "extapi.aistocklink.cn"
custom_domain = true

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[placement]
mode = "smart"
